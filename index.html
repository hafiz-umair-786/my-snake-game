        GOT IT <span>↗</span>
      </button>
    </dialog>
    <dialog id="historyDialog" class="history-dialog">
      <button class="close" id="closeHistory">×</button>
      <p class="eyebrow">Personal Record</p>
      <h2>Detailed History</h2>
      <div class="history-summary">
        <div><span>RUNS LOGGED</span><strong id="historyTotal">0</strong></div>
        <div><span>BEST SCORE</span><strong id="historyBest">0</strong></div>
        <div>
          <span>LATEST SCORE</span><strong id="historyLatest">--</strong>
        </div>
      </div>
      <div class="history-actions">
        <button class="history-action" id="downloadHistory">
          DOWNLOAD TXT
        </button>
        <button class="history-action danger" id="clearHistory">
          CLEAR HISTORY
        </button>
      </div>
      <div class="history-head">
        <span>RUN</span><span>DATE / TIME</span><span>RESULT</span>
      </div>
      <div id="historyList" class="history-list">
        <div class="empty">No runs yet. Make your first mark.</div>
      </div>
    </dialog>
    <audio id="backgroundMusic" loop>
      <source src="/music.mp3" type="audio/mpeg" />
    </audio>
    <script src="/script.js"></script>
  </body>
</html>
